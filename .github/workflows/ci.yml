name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    name: Librería · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Los extremos del rango que declara `engines`, más el LTS de en medio.
        node: ['18', '20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Construir el paquete
        run: npm run build

      - name: Verificar el paquete construido
        run: node scripts/smoke.mjs

  demo:
    name: Demo (Angular)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # El CLI de Angular 22 exige Node >= 24.15; no vale el mismo rango que la
      # librería, que se mantiene compatible desde Node 18.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - run: npm ci
        working-directory: demo

      - name: Construir el demo
        run: npm run build
        working-directory: demo
